function applyHome(){
  HOME_HEAD.forEach((h, i) => {
    const el = headNodes[i];
    el.style.fontSize = h.size + "px";
    Object.assign(el._pos, h);
  });
  TITLE_POS.x = HOME_TITLE.x;
  TITLE_POS.y = HOME_TITLE.y;
  paintFree();
  rebuildExclude();
}

const HEAD_MODES = ["toss", "chaos", "cascade", "upright", "stack"];
let headMode = 0;

/* Positions come from the words' *measured* widths, not from numbers I guessed —
   so every mode survives a font change or an edit to the copy. */
function layoutHead(mode){
  const BASE = 132;
  const cfg = {
    toss:    { size:[1.00, 1.20, 0.98, 1.46], rot:[-11,   9, -23,  6] },
    /* never put -90 on "I" — one letter on its side just reads as a dash.
       The sideways trick belongs on a multi-letter word (see upright). */
    chaos:   { size:[1.06, 0.84, 1.22, 1.58], rot:[-26,  17, -52,  8] },
    cascade: { size:[1.00, 1.00, 1.00, 1.14], rot:[ -5,  -2,   3,  7] },
    upright: { size:[1.00, 0.94, 1.00, 1.34], rot:[  0, -90,   0,  0] },
    stack:   { size:[1.00, 1.00, 1.00, 1.00], rot:[  0,   0,   0,  0] }
  }[mode] || {};

  headNodes.forEach((el, i) => { el.style.fontSize = Math.round(BASE * cfg.size[i]) + "px"; });
  const W = headNodes.map(el => el.offsetWidth);
  const H = headNodes.map(el => el.offsetHeight);

  const X0 = -520, Y0 = -700;
  let pos;

  if(mode === "stack"){
    pos = []; let x = X0, y = Y0;
    headNodes.forEach((el, i) => {
      if(i > 0 && x + W[i] > X0 + 1040){ x = X0; y += H[i] * 0.9; }
      pos.push({ x, y });
      x += W[i] + BASE * 0.17;
    });
  } else if(mode === "cascade"){
    pos = []; let x = X0, y = Y0;
    headNodes.forEach((el, i) => { pos.push({ x, y }); x += W[i] * 0.30; y += H[i] * 0.80; });
  } else if(mode === "upright"){
    /* lay the three horizontal words first, then swing the turned one clear
       of the widest of them — otherwise it lands on top of "Create." */
    const yI = Y0 + H[0] * 0.98;
    const xC = X0 + W[2] + BASE * 0.22;
    const rightEdge = Math.max(X0 + W[0], xC + W[3]);
    pos = [];
    pos[0] = { x: X0, y: Y0 };
    pos[2] = { x: X0, y: yI };
    pos[3] = { x: xC, y: yI - H[3] * 0.06 };
    pos[1] = { x: rightEdge + 110 - W[1] / 2 + H[1] / 2, y: Y0 + W[1] / 2 - H[1] / 2 };
  } else if(mode === "chaos"){
    /* nothing lines up with anything: each word gets its own corner */
    pos = [
      { x: X0 + 60,                  y: Y0 },
      { x: X0 + W[0] * 1.02,         y: Y0 + H[1] * 0.95 },
      { x: X0 - 40,                  y: Y0 + H[0] * 1.35 },
      { x: X0 + W[2] * 0.9 + 120,    y: Y0 + H[0] * 1.6 }
    ];
  } else {  /* toss */
    pos = [
      { x: X0,                       y: Y0 },
      { x: X0 + W[0] * 0.88,         y: Y0 - H[1] * 0.50 },
      { x: X0 + 30,                  y: Y0 + H[0] * 1.10 },
      { x: X0 + W[2] * 1.8 + 60,     y: Y0 + H[0] * 0.84 }
    ];
  }

  headNodes.forEach((el, i) => {
    el._pos.x = pos[i].x; el._pos.y = pos[i].y; el._pos.rot = cfg.rot[i];
  });

  /* park the intro copy just under whatever shape the words ended up in */
  let bottom = -Infinity, left = Infinity;
  headNodes.forEach((el, i) => {
    bottom = Math.max(bottom, el._pos.y + H[i]);
    left   = Math.min(left,   el._pos.x);
  });
  TITLE_POS.x = X0;
  TITLE_POS.y = bottom + 54;

  paintFree();

  rebuildExclude();
}

/* rotated words sweep a bigger box than their set width — pad for it */
function rebuildExclude(){
  EXCLUDE = headNodes.map(el => {
    const w = el.offsetWidth, h = el.offsetHeight;
    const pad = Math.abs(el._pos.rot) > 45 ? Math.max(w, h) * 0.5 : 0;
    return { x: el._pos.x - pad, y: el._pos.y - pad, w: w + pad * 2, h: h + pad * 2 };
  });
  EXCLUDE.push({ x: TITLE_POS.x, y: TITLE_POS.y,
                 w: titleNode.offsetWidth, h: titleNode.offsetHeight });
}

/* every free-floating chrome node paints from its own _pos */
function paintFree(){
  [titleNode].concat(headNodes).forEach(el => {
    const P = el._pos;
    el.style.transform =
      "translate3d(" + P.x + "px," + P.y + "px,0)" + (P.rot ? " rotate(" + P.rot + "deg)" : "");
    if(P.z) el.style.zIndex = P.z;
  });
}

function paintNodes(){
  paintFree();
  nodes.forEach((el, i) => {
    const L = layout[i];
    el.style.width = L.size + "px";
    el.style.setProperty("--sleeve", L.size);
    el.style.transform = "translate3d(" + L.x + "px," + L.y + "px,0) rotate(" + L.rot + "deg)";
    el.style.zIndex = L.z;
  });
}

function paintView(){
  planeEl.style.transform =
    "translate3d(" + view.x + "px," + view.y + "px,0) scale(" + view.scale + ")";
  canvasEl.style.backgroundSize = (26 * view.scale) + "px " + (26 * view.scale) + "px";
  canvasEl.style.backgroundPosition = view.x + "px " + view.y + "px";
  zoomReadout.textContent = Math.round(view.scale * 100) + "%";
}

/* ═══════════════════════════════════════════════════════
   VIEW MOVEMENT
   ═══════════════════════════════════════════════════════ */

function ease(fn){
  planeEl.classList.add("is-eased");
  fn();
  paintView();
  clearTimeout(ease._t);
  ease._t = setTimeout(() => planeEl.classList.remove("is-eased"), 620);
}

/* The usable band sits between the fixed topbar and the fixed filter rail. */
function freeArea(){
  const top = document.querySelector(".topbar").offsetHeight;
  const bot = railEl.offsetHeight;
  return { top, bot, cx: window.innerWidth / 2,
           cy: top + (window.innerHeight - top - bot) / 2,
           w: window.innerWidth, h: window.innerHeight - top - bot };
}

/* Put plane-space point (px,py) at the centre of that band. */
function centerOn(px, py, scale){
  const a = freeArea();
  const s = scale != null ? scale : view.scale;
  view.scale = s;
  view.x = a.cx - px * s;
  view.y = a.cy - py * s;
}

/* The masthead: the title block plus the headline words, which are separate
   objects on the plane. EXCLUDE already tracks exactly these. */
function mastheadBox(){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const eat = (x, y, w, h) => {
    minX = Math.min(minX, x);      minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w);  maxY = Math.max(maxY, y + h);
  };
  /* Only the headline words. The intro block sits below and to the left of
     them, and counting it here dragged the centroid down-left — which put the
     headline itself off-centre on the opening view. Measured live rather than
     from EXCLUDE so this never depends on when EXCLUDE was last rebuilt. */
  headNodes.forEach(el => eat(el._pos.x, el._pos.y, el.offsetWidth, el.offsetHeight));
  if(!isFinite(minX)) eat(TITLE_POS.x, TITLE_POS.y, TITLE_W, TITLE_H);
  return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
}

/* Home lands on the title, at the tuned zoom. The pan is computed against the
   live viewport rather than baked in, so it centres on any screen width. */
function homeView(){
  const a = freeArea(), m = mastheadBox(), s = HOME_VIEW.scale;
  return { scale: s, x: a.cx - m.cx * s, y: a.cy - m.cy * s };
}

/* Home: the title reading at full size, with the nearest sleeves around it. */
function recenter(){
  const v = homeView();
  ease(() => { view.x = v.x; view.y = v.y; view.scale = v.scale; });
}

function fitAll(){
  const boxes = layout
    .filter((L, i) => visible(i))
    .map(L => ({ x: L.x, y: L.y, w: L.size, h: L.size + 54 }));
  if(activeCat === "all" && isAllTime())
    EXCLUDE.forEach(r => boxes.push({ x: r.x, y: r.y, w: r.w, h: r.h }));
  if(!boxes.length) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  boxes.forEach(b => {
    minX = Math.min(minX, b.x);         minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w);   maxY = Math.max(maxY, b.y + b.h);
  });

  const a = freeArea(), pad = 80;
  const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE,
    Math.min((a.w - pad * 2) / (maxX - minX), (a.h - pad * 2) / (maxY - minY))));
  ease(() => centerOn((minX + maxX) / 2, (minY + maxY) / 2, s));
}

function zoomAt(clientX, clientY, factor){
  const next = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale * factor));
  if(next === view.scale) return;
  /* keep the point under the cursor pinned while the scale changes */
  view.x = clientX - (clientX - view.x) * (next / view.scale);
  view.y = clientY - (clientY - view.y) * (next / view.scale);
  view.scale = next;
  paintView();
}

/* ═══════════════════════════════════════════════════════
   HOVER FLIP
   ═══════════════════════════════════════════════════════ */

let hoverTimer = null;
let suppressHover = false;   // true while panning or dragging

function flip(el, on){
  el.classList.toggle("is-flipped", on);
}

function clearFlips(){
  nodes.forEach(el => el.classList.remove("is-flipped"));
}

nodes.forEach(el => {
  el.addEventListener("pointerenter", ev => {
    if(ev.pointerType !== "mouse") return;
    if(suppressHover) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => { if(!suppressHover) flip(el, true); }, HOVER_DELAY);
  });
  el.addEventListener("pointerleave", ev => {
    if(ev.pointerType !== "mouse") return;
    clearTimeout(hoverTimer);
    flip(el, false);
  });
  /* keyboard: Enter opens, Space flips */
  el.addEventListener("keydown", ev => {
    if(ev.key === "Enter"){ ev.preventDefault(); openDetail(+el.dataset.index); }
    if(ev.key === " "){ ev.preventDefault(); flip(el, !el.classList.contains("is-flipped")); }
  });
  el.addEventListener("focus", () => flip(el, true));
  el.addEventListener("blur",  () => flip(el, false));
});

/* ═══════════════════════════════════════════════════════
   POINTER: pan the ground, drag a node, click to open
   ═══════════════════════════════════════════════════════ */

let gesture = null;                  // active single-pointer gesture
const pointers = new Map();          // for pinch

/* one accessor for "where does this node live on the plane" */
function escText(t){
  return String(t).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

function posOf(el){
  if(!el) return null;
  return el.dataset.kind === "entry" ? layout[+el.dataset.index] : el._pos;
}

canvasEl.addEventListener("pointerdown", ev => {
  if(ev.button === 2) return;        // right-click handled separately
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if(pointers.size === 2){ beginPinch(); return; }
  if(pointers.size > 1) return;

  closeMenu();
  const nodeEl = ev.target.closest(".node");

  gesture = {
    id: ev.pointerId,
    node: nodeEl,
    index: nodeEl && nodeEl.dataset.kind === "entry" ? +nodeEl.dataset.index : -1,
    pos: posOf(nodeEl),
    startX: ev.clientX,
    startY: ev.clientY,
    originX: nodeEl ? posOf(nodeEl).x : view.x,
    originY: nodeEl ? posOf(nodeEl).y : view.y,
    moved: false
  };

  /* A link inside a node stays a link. Capturing the pointer on the canvas
     retargets the follow-up click to the canvas itself (WebKit and Chrome on
     macOS both do this), so the href never fires. Skip the capture there: the
     drag still tracks via pointermove, and a drag that moved already eats its
     own click below. */
  if(!ev.target.closest("a[href]")) canvasEl.setPointerCapture(ev.pointerId);
  if(!nodeEl) canvasEl.classList.add("is-panning");
});

canvasEl.addEventListener("pointermove", ev => {
  if(pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if(pointers.size === 2){ updatePinch(); return; }
  if(!gesture || ev.pointerId !== gesture.id) return;

  const dx = ev.clientX - gesture.startX;
  const dy = ev.clientY - gesture.startY;

  if(!gesture.moved && Math.hypot(dx, dy) < DRAG_SLOP) return;

  if(!gesture.moved){
    gesture.moved = true;
    suppressHover = true;
    clearTimeout(hoverTimer);
    dismissHint();
    const sel = window.getSelection(); if(sel) sel.removeAllRanges();
    if(gesture.node){
      gesture.node.classList.add("is-dragging");
      flip(gesture.node, false);              // a drag cancels the flip
      if(gesture.index >= 0){
        layout[gesture.index].z = ++topZ;      // grabbed thing comes to the top
        gesture.node.style.zIndex = topZ;
      }
    }
  }

  if(gesture.node){
    /* screen delta → plane delta */
    const P = gesture.pos;
    P.x = gesture.originX + dx / view.scale;
    P.y = gesture.originY + dy / view.scale;
    gesture.node.style.transform =
      "translate3d(" + P.x + "px," + P.y + "px,0)" + (P.rot ? " rotate(" + P.rot + "deg)" : "");
  }else{
    view.x = gesture.originX + dx;
    view.y = gesture.originY + dy;
    paintView();
  }
});

function endGesture(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size < 2) pinch = null;
  if(!gesture || ev.pointerId !== gesture.id) return;

  canvasEl.classList.remove("is-panning");
  if(gesture.node) gesture.node.classList.remove("is-dragging");

  /* a drag that started on a link must not also fire that link's click */
  if(gesture.moved){
    const eat = ev2 => ev2.preventDefault();
    document.addEventListener("click", eat, { capture: true, once: true });
    setTimeout(() => document.removeEventListener("click", eat, true), 0);
  }

  if(!gesture.moved && gesture.index >= 0){
    openDetail(gesture.index);                 // a click that never became a drag
  }else if(gesture.moved && gesture.node){
    if(gesture.index >= 0){
      tidyMode = false;
      untidyLayout = null;      /* rearranging from the grid makes the grid yours */
      document.getElementById("btnTidy").setAttribute("aria-pressed", "false");
    }else{
      rebuildExclude();          // a moved word changes where a re-scatter may land
    }
    saveLayout();
  }

  gesture = null;
  suppressHover = false;
}

canvasEl.addEventListener("pointerup", endGesture);
canvasEl.addEventListener("pointercancel", endGesture);

/* ── pinch to zoom ── */
let pinch = null;
function pinchState(){
  const p = [...pointers.values()];
  return { dist: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y),
           cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2 };
}
function beginPinch(){
  gesture = null;
  canvasEl.classList.remove("is-panning");
  suppressHover = true;
  pinch = pinchState();
}
function updatePinch(){
  if(!pinch) return;
  const now = pinchState();
  if(pinch.dist > 0) zoomAt(now.cx, now.cy, now.dist / pinch.dist);
  pinch = now;
}

/* ── wheel: trackpad pans, ctrl/cmd+wheel zooms ── */
canvasEl.addEventListener("wheel", ev => {
  ev.preventDefault();
  dismissHint();
  if(ev.ctrlKey || ev.metaKey){
    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0075));
  }else{
    view.x -= ev.deltaX;
    view.y -= ev.deltaY;
    paintView();
  }
}, { passive: false });

/* ═══════════════════════════════════════════════════════
   RIGHT-CLICK MENU
   ═══════════════════════════════════════════════════════ */

canvasEl.addEventListener("contextmenu", ev => {
  ev.preventDefault();
  const nodeEl = ev.target.closest(".node");
  if(nodeEl && nodeEl.dataset.kind === "entry"){
    openMenu(ev.clientX, ev.clientY, +nodeEl.dataset.index);
  }else{
    openMenu(ev.clientX, ev.clientY, -1);
  }
});

function openMenu(x, y, index){
  clearFlips();
  const e = index >= 0 ? ENTRIES[index] : null;
  const items = e
    ? [["Open detail",      "open"],
       ["Bring to front",   "front"],
       ["Send to back",     "back"],
       ["Straighten",       "straighten"],
       ["Send here",        "here"]]
    : [["Recenter",         "recenter"],
       ["Fit all",          "fit"],
       ["Re-scatter",       "scatter"],
       ["Reset zoom",       "zoom1"]];

  menuEl.innerHTML =
    '<div class="ctxmenu__head">' + (e ? e.no + " · " + e.title : "Canvas") + "</div>" +
    items.map(it => '<button data-act="' + it[1] + '">' + it[0] + "</button>").join("");
  menuEl.dataset.index = index;
  menuEl.classList.add("is-open");

  /* keep it on screen */
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.min(x, window.innerWidth  - r.width  - 8) + "px";
  menuEl.style.top  = Math.min(y, window.innerHeight - r.height - 8) + "px";
}

function closeMenu(){ menuEl.classList.remove("is-open"); }

menuEl.addEventListener("click", ev => {
  const btn = ev.target.closest("button");
  if(!btn) return;
  const i = +menuEl.dataset.index;
  const act = btn.dataset.act;

  if(act === "open")       openDetail(i);
  if(act === "front"){     layout[i].z = ++topZ; nodes[i].style.zIndex = topZ; saveLayout(); }
  if(act === "back"){      layout.forEach(L => L.z += 1); layout[i].z = 1; paintNodes(); saveLayout(); }
  if(act === "straighten"){layout[i].rot = 0; paintNodes(); saveLayout(); }
  if(act === "here"){
    /* drop it at the centre of the current view */
    const L = layout[i];
    L.x = (window.innerWidth / 2 - view.x) / view.scale - L.size / 2;
    L.y = (window.innerHeight / 2 - view.y) / view.scale - L.size / 2;
    L.z = ++topZ;
    paintNodes(); saveLayout();
  }
  if(act === "recenter")   recenter();
  if(act === "fit")        fitAll();
  if(act === "scatter")    doScatter();
  if(act === "zoom1")      ease(() => zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / view.scale));

  closeMenu();
});

/* ═══════════════════════════════════════════════════════
   DETAIL PAGE
   ═══════════════════════════════════════════════════════ */

/* ── the now-playing bar ───────────────────────────────
   UNTITLED (generated at the top of this file) gives us the mp3 behind each project,
   so music plays through our own <audio> and our own transport. a project missing from
   UNTITLED falls back to untitled.stream's iframe in the deck below. */
const barEl    = document.getElementById("bar");
const audioEl  = document.getElementById("barAudio");
const barArt   = document.getElementById("barArt");
const barTitle = document.getElementById("barTitle");
const barSub   = document.getElementById("barSub");
const barMenu  = document.getElementById("barMenu");
const barFill  = document.getElementById("barFill");
const barSeek  = document.getElementById("barSeek");

let queue = [];      // tracks of the record now loaded
let qi    = 0;       // index into queue
let qFrom = -1;      // ENTRIES index the queue came from

const SVG_PLAY  = '<svg viewBox="0 0 24 24"><path d="M6 3.5 20.5 12 6 20.5z"/></svg>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M5.5 3.5h5v17h-5zm8 0h5v17h-5z"/></svg>';

// the rail is fixed to the bottom, so the bar has to sit exactly on top of it
function measureRail(){
  document.documentElement.style.setProperty("--rail-h", railEl.offsetHeight + "px");
}

function mmss(sec){
  sec = Math.max(0, Math.round(sec || 0));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

function untitledFor(e){
  const id = e.media && e.media.type === "embed" && e.media.src.split("/").pop();
  return id && UNTITLED[id] ? UNTITLED[id] : null;
}

function playRecord(i, n){
  const e = ENTRIES[i], u = untitledFor(e);
  if(!u) return;
  if(qFrom !== i){ queue = u.tracks; qFrom = i; }
  ejectDeck();                       // one player at a time: a docked video steps aside
  loadTrack(n || 0, true);
  barEl.classList.add("is-live");
  barEl.classList.toggle("is-paused", audioEl.paused);
  measureRail();
}

function loadTrack(n, autoplay){
  if(!queue[n]) return;
  qi = n;
  const e = ENTRIES[qFrom];
  audioEl.src = queue[n].src;
  barArt.src = e.cover || "";
  barArt.alt = e.title;
  barTitle.textContent = queue[n].t;
  barSub.textContent = e.title + " · " + mmss(queue[n].d);
  barFill.style.width = "0%";
  if(autoplay) audioEl.play().catch(() => {});   // a blocked autoplay is not an error
  paintTrackRows();
}

function nextTrack(step){
  const n = qi + (step || 1);
  if(n < 0) return loadTrack(0, true);
  if(n >= queue.length){
    if(!audioEl.loop) { audioEl.pause(); audioEl.currentTime = 0; }
    return loadTrack(0, audioEl.loop);
  }
  loadTrack(n, true);
}

// mark the row that is playing, whenever the sheet happens to be showing this record
function paintTrackRows(){
  document.querySelectorAll(".detail__track--live").forEach(row => {
    const on = Number(row.dataset.entry) === qFrom && Number(row.dataset.track) === qi;
    row.classList.toggle("detail__track--on", on);
  });
  const btn = document.querySelector("[data-play-entry]");
  if(btn) btn.querySelector("[data-icon]").innerHTML =
    (Number(btn.dataset.playEntry) === qFrom && !audioEl.paused) ? SVG_PAUSE : SVG_PLAY;
}

function paintPlayBtn(){
  const b = barEl.querySelector('[data-bar="toggle"]');
  barEl.classList.toggle("is-paused", audioEl.paused);   // freezes the sleeve's bars
  b.innerHTML = audioEl.paused ? SVG_PLAY : SVG_PAUSE;
  b.title = b.ariaLabel = audioEl.paused ? "Play" : "Pause";
  paintTrackRows();
}

function stopAudio(){
  audioEl.pause();
  audioEl.removeAttribute("src");
  audioEl.load();
  barEl.classList.remove("is-live");
  barMenu.classList.remove("is-open");
  queue = []; qi = 0; qFrom = -1;
  paintTrackRows();
}

barEl.addEventListener("click", ev => {
  const b = ev.target.closest("[data-bar]");
  if(!b) return;
  const act = b.dataset.bar;
  if(act === "toggle") audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause();
  if(act === "next")   nextTrack(1);
  if(act === "prev")   audioEl.currentTime > 3 ? (audioEl.currentTime = 0) : nextTrack(-1);
  if(act === "loop"){
    audioEl.loop = !audioEl.loop;
    b.setAttribute("aria-pressed", String(audioEl.loop));
  }
  if(act === "more"){
    const open = !barMenu.classList.contains("is-open");
    const e = ENTRIES[qFrom];
    barMenu.innerHTML =
      '<button data-bar="notes">Liner notes</button>' +
      (e && e.href && /^https?:/.test(e.href)
        ? '<a href="' + e.href + '" target="_blank" rel="noopener">Open on untitled.stream</a>' : "") +
      '<button data-bar="stop">Close</button>';
    const box = barEl.getBoundingClientRect();
    barMenu.style.right  = Math.max(12, innerWidth - box.right) + "px";
    barMenu.style.bottom = (innerHeight - box.top + 9) + "px";
    barMenu.classList.toggle("is-open", open);
    b.setAttribute("aria-expanded", String(open));
  }
  if(act === "notes"){ barMenu.classList.remove("is-open"); openDetail(qFrom); }
  if(act === "stop")  stopAudio();
});

/* Dragging. The tile is anchored by its right edge so opening grows leftward and
   the sleeve never jumps, which means we store distances from the right and bottom
   rather than left and top. Kept inside the viewport, clear of the rail. */
const BAR_POS = "shen.bar.pos";

function barLimits(){
  const open = Math.min(430, innerWidth - 24);
  const rail = railEl.offsetHeight;
  return {
    rMin: 12, rMax: Math.max(12, innerWidth - open - 12),
    bMin: rail + 8, bMax: Math.max(rail + 8, innerHeight - 96)
  };
}

function placeBar(r, b){
  const L = barLimits();
  r = Math.min(Math.max(r, L.rMin), L.rMax);
  b = Math.min(Math.max(b, L.bMin), L.bMax);
  barEl.style.setProperty("--bar-r", r + "px");
  barEl.style.setProperty("--bar-b", b + "px");
  barEl.classList.add("bar--placed");
  try{ localStorage.setItem(BAR_POS, JSON.stringify({ r, b })); }catch(_){}
}

try{
  const saved = JSON.parse(localStorage.getItem(BAR_POS) || "null");
  if(saved) placeBar(saved.r, saved.b);
}catch(_){}

let drag = null;
barEl.addEventListener("pointerdown", ev => {
  if(ev.target.closest("button, a, .bar__seek")) return;   // controls come first
  const box = barEl.getBoundingClientRect();
  drag = {
    id: ev.pointerId, x: ev.clientX, y: ev.clientY, moved: false,
    r: innerWidth - box.right, b: innerHeight - box.bottom
  };
  barEl.setPointerCapture(ev.pointerId);
});
barEl.addEventListener("pointermove", ev => {
  if(!drag || ev.pointerId !== drag.id) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if(!drag.moved && Math.hypot(dx, dy) < 4) return;        // a click is not a drag
  drag.moved = true;
  barEl.classList.add("is-dragging");
  placeBar(drag.r - dx, drag.b - dy);
});
barEl.addEventListener("pointerup", ev => {
  if(!drag || ev.pointerId !== drag.id) return;
  barEl.releasePointerCapture(ev.pointerId);
  barEl.classList.remove("is-dragging");
  // a tap opens it, for touch and for anything else without a hover
  if(!drag.moved) barEl.classList.toggle("is-open");
  drag = null;
});
window.addEventListener("resize", () => {
  if(!barEl.classList.contains("bar--placed")) return;
  const box = barEl.getBoundingClientRect();
  placeBar(innerWidth - box.right, innerHeight - box.bottom);
});

// click anywhere on the hairline to seek
barSeek.addEventListener("click", ev => {
  if(!audioEl.duration) return;
  const r = barSeek.getBoundingClientRect();
  audioEl.currentTime = ((ev.clientX - r.left) / r.width) * audioEl.duration;
});

audioEl.addEventListener("timeupdate", () => {
  if(audioEl.duration)
    barFill.style.width = (audioEl.currentTime / audioEl.duration * 100) + "%";
});
audioEl.addEventListener("ended", () => nextTrack(1));
audioEl.addEventListener("play", paintPlayBtn);
audioEl.addEventListener("pause", paintPlayBtn);
document.addEventListener("click", ev => {
  if(!ev.target.closest("#bar") && !ev.target.closest("#barMenu"))
    barMenu.classList.remove("is-open");
});
// the menu sits outside the tile now, so its own clicks need the same handler
barMenu.addEventListener("click", ev => {
  const b = ev.target.closest("[data-bar]");
  if(!b) return;
  barMenu.classList.remove("is-open");
  if(b.dataset.bar === "notes") openDetail(qFrom);
  if(b.dataset.bar === "stop")  stopAudio();
});
window.addEventListener("resize", measureRail);
window.addEventListener("load", measureRail);   // webfonts change the chip height
measureRail();

/* ── the deck ──────────────────────────────────────────
   one player for the whole page. it is a child of <body> and never moves in the DOM,
   because reparenting an iframe reloads it — the sound would stop. opening a record
   parks it over the sheet's slot; closing the sheet sends it to the corner, still
   playing, with its own stop button. */
const deckEl    = document.getElementById("deck");
const deckMedia = deckEl.querySelector(".deck__media");
const deckNow   = deckEl.querySelector(".deck__now");
let deckIndex   = -1;      // entry loaded in the deck, -1 when empty
let deckEngaged = false;   // did the listener actually start it?

function playerHTML(m){
  if(m.type === "youtube")
    return '<iframe class="yt" src="https://www.youtube.com/embed/' + m.id + '" title="" allowfullscreen ' +
           'allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>';
  if(m.type === "embed")
    return '<iframe src="' + m.src + '" allow="autoplay; clipboard-write; encrypted-media"></iframe>';
  return '<video src="' + m.src + '" controls preload="metadata" playsinline></video>';
}

// the untitled embed has one true height; everything else is 16:9
function isRatio(m){ return m.type !== "embed"; }
const EMBED_W = 900;   // internal width that keeps untitled's compact player on one row

function loadDeck(i){
  if(deckIndex === i) return;   // already loaded: leave it be, rebuilding would reload it
  stopAudio();   // one player at a time — a paused tile would linger beside the video
  const e = ENTRIES[i];
  deckIndex = i;
  deckEngaged = false;
  deckMedia.innerHTML = playerHTML(e.media);
  deckNow.innerHTML = 'Playing · <b>' + e.title + '</b>';
  const el = deckMedia.firstElementChild;
  if(el.tagName === "VIDEO") el.addEventListener("play", () => { deckEngaged = true; });
  deckEl.classList.add("is-live");
}

function parkDeck(){
  deckEl.classList.remove("deck--docked");
  deckEl.classList.add("deck--parked");
  const el = deckMedia.firstElementChild;
  if(el) el.style.cssText = "";   // undo the docked bar's downscale
  // the sheet slides in over ~420ms — follow the slot until it settles, or the deck
  // parks where the slot *was* and sits 28px off for the rest of the session
  const until = performance.now() + 560;
  (function follow(){
    syncDeck();
    if(performance.now() < until && deckEl.classList.contains("deck--parked"))
      requestAnimationFrame(follow);
  })();
}

// the deck is position:fixed, so parking it means copying the slot's rect every time
// the sheet scrolls or the window resizes
function syncDeck(){
  if(!deckEl.classList.contains("deck--parked")) return;
  const slot = document.getElementById("detailSlot");
  if(!slot) return;
  const r = slot.getBoundingClientRect();
  const s = detailSheet.getBoundingClientRect();
  deckEl.style.left  = r.left + "px";
  deckEl.style.top   = r.top + "px";
  deckEl.style.width = r.width + "px";
  deckMedia.style.height = r.height + "px";
  // nothing clips a fixed element, so clip it to the sheet by hand
  const top = Math.max(0, s.top - r.top), bot = Math.max(0, r.bottom - s.bottom);
  deckEl.style.clipPath = (top || bot) ? "inset(" + top + "px 0 " + bot + "px 0)" : "";
}

function dockDeck(){
  if(deckIndex < 0) return;
  const m = ENTRIES[deckIndex].media;
  const el = deckMedia.firstElementChild;
  deckEl.classList.remove("deck--parked");
  deckEl.classList.add("deck--docked");
  deckEl.style.left = deckEl.style.top = deckEl.style.width = deckEl.style.clipPath = "";
  const w = deckMedia.clientWidth;   // measure after the flex layout resolves
  if(m.type === "embed" && w >= 300){
    // untitled's compact player only stays on one line in a wide box — under ~700px it
    // stacks, and 192px then clips it to nothing. so render it wide and shrink it to bar
    // height. css zoom, not transform: scale() — a scaled cross-origin iframe paints
    // blank in Chrome, while zoom relays the content out and keeps its buttons live.
    const k = w / EMBED_W;
    el.style.cssText = "width:" + EMBED_W + "px;height:192px;zoom:" + k;
    deckMedia.style.height = Math.round(192 * k) + "px";
  }else if(m.type === "embed"){
    // a phone has no room to shrink that row into — dock the stacked layout instead
    el.style.cssText = "width:100%;height:300px";
    deckMedia.style.height = "300px";
  }else{
    el.style.cssText = "";
    deckMedia.style.height = Math.round(w * 9 / 16) + "px";
  }
}

function ejectDeck(){
  deckEl.classList.remove("is-live", "deck--parked", "deck--docked");
  deckEl.style.left = deckEl.style.top = deckEl.style.width = deckEl.style.clipPath = "";
  deckMedia.innerHTML = "";   // the only thing that actually stops the sound
  deckIndex = -1;
  deckEngaged = false;
}

deckEl.addEventListener("click", ev => {
  if(ev.target.closest('[data-deck="eject"]')) ejectDeck();
});

// a cross-origin player can't report that it started. clicking into one blurs the
// window and leaves the iframe as the active element — that is the signal.
window.addEventListener("blur", () => {
  if(deckIndex > -1 && document.activeElement === deckMedia.firstElementChild) deckEngaged = true;
});
window.addEventListener("resize", () => {
  syncDeck();
  if(deckEl.classList.contains("deck--docked")) dockDeck();   // the bar's width moved
});
detailSheet.addEventListener("scroll", syncDeck);

// the slot the deck parks over. if the deck is busy with something else, the sheet
// offers to take it over rather than silently cutting the music off.
function slotHTML(e, i){
  if(!e.media) return "";
  const u = untitledFor(e);
  if(u) return (
    '<div class="detail__slot record" id="detailSlot">' +
      (e.cover ? '<img class="record__art" src="' + e.cover + '" alt="">' : "") +
      '<div class="record__side">' +
        '<button class="record__play" data-play-entry="' + i + '">' +
          '<span data-icon>' + SVG_PLAY + '</span>' +
          (u.tracks.length > 1 ? "Play all" : "Play") +
        "</button>" +
        '<p class="record__note">' + u.tracks.length + " tracks · " +
          mmss(u.tracks.reduce((a, t) => a + t.d, 0)) + " · from untitled.stream</p>" +
      "</div>" +
    "</div>");
  const busy = deckIndex > -1 && deckIndex !== i && deckEngaged;
  const cls  = "detail__slot" + (isRatio(e.media) ? " detail__slot--ratio" : "");
  const size = e.media.type === "embed" ? ' style="height:' + e.media.height + 'px"' : "";
  return '<div class="' + cls + '" id="detailSlot"' + size + '>' +
         (busy
           ? '<button class="detail__takeover" data-takeover="' + i + '">Play — replaces ' +
             ENTRIES[deckIndex].title + ' in the deck</button>'
           : "") +
         "</div>";
}

detailSheet.addEventListener("click", ev => {
  const play = ev.target.closest("[data-play-entry]");
  if(play){
    const i = Number(play.dataset.playEntry);
    if(qFrom === i && !audioEl.paused) audioEl.pause();
    else if(qFrom === i) audioEl.play().catch(() => {});
    else playRecord(i, 0);
    return;
  }
  const row = ev.target.closest(".detail__track--live");
  if(row){ playRecord(Number(row.dataset.entry), Number(row.dataset.track)); return; }

  const b = ev.target.closest("[data-takeover]");
  if(!b) return;
  const i = Number(b.dataset.takeover);
  document.getElementById("detailSlot").innerHTML = "";
  loadDeck(i);
  parkDeck();
});

function openDetail(i){
  const e = ENTRIES[i];
  const rows = e.rows.map(r => '<div class="liner__row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join("");
  // prefer untitled's own tracklist when we have it: it cannot drift out of date, and
  // every row is clickable because we hold the audio
  const u = untitledFor(e);
  const rowsOf = u
    ? u.tracks.map((t, n) =>
        '<div class="detail__track detail__track--live" data-entry="' + i + '" data-track="' + n + '">' +
        "<span>" + t.t + "</span><span>" + mmss(t.d) + "</span></div>").join("")
    : (e.tracks || []).map(t =>
        '<div class="detail__track"><span>' + t[0] + '</span><span>' + t[1] + "</span></div>").join("");
  const tracks = (u || e.tracks)
    ? '<div class="detail__tracks"><h4>Tracklist</h4>' + rowsOf + "</div>"
    : "";

  detailSheet.innerHTML =
    '<button class="detail__close" id="detailClose">Close · Esc</button>' +
    '<p class="detail__no">' + e.no + " · " + CAT_NAME[e.cat] + "</p>" +
    '<h2 class="detail__title">' + e.title + "</h2>" +
    '<p class="detail__format">' + e.format + " · " + e.year + "</p>" +
    (e.ytTitle && e.ytTitle !== e.title ? '<p class="detail__alt">' + e.ytTitle + "</p>" : "") +
    (e.tweetUrl
      ? '<div class="detail__tweet"><blockquote class="twitter-tweet" data-theme="dark" data-dnt="true">' +
        "<p>" + e.blurb + '</p><a href="' + e.tweetUrl + '"></a></blockquote></div>'
      : e.blurb ? '<p class="detail__blurb">' + e.blurb + "</p>" : "") +
    slotHTML(e, i) +
    '<div class="detail__rows">' + rows + "</div>" +
    tracks +
    (e.href && e.href !== "#"
      ? '<a class="detail__cta" href="' + e.href + '"' +
        (/^https?:/.test(e.href) ? ' target="_blank" rel="noopener"' : "") +
        '>' + e.cta + " →</a>"
      : '<span class="detail__cta detail__cta--soon">' + e.cta + " — soon</span>");

  detailEl.classList.add("is-open");
  // park the deck over the slot — unless it is busy playing something else, in which
  // case the slot shows a takeover button and the docked player keeps going
  if(untitledFor(e)){
    // our own player handles this one — the sheet only shows the sleeve
    if(deckEl.classList.contains("deck--parked")) dockDeck();
    paintTrackRows();
  }else if(e.media && !(deckIndex > -1 && deckIndex !== i && deckEngaged)){ loadDeck(i); parkDeck(); }
  else if(deckEl.classList.contains("deck--parked")) dockDeck();
  // the sheet is rebuilt each time, so the widget has to be asked to render again
  if(e.tweetUrl && window.twttr && twttr.widgets) twttr.widgets.load(detailSheet);
  document.getElementById("detailClose").addEventListener("click", closeDetail);
  detailSheet.scrollTop = 0;
  clearFlips();
}

function closeDetail(){
  detailEl.classList.remove("is-open");
  detailSheet.innerHTML = "";   // notes only — the player is not in here
  // whatever was started keeps playing, docked in the corner; an untouched player
  // has nothing to keep, so it goes
  if(deckEngaged) dockDeck(); else ejectDeck();
}

detailEl.addEventListener("pointerdown", ev => {
  if(ev.target === detailEl) closeDetail();
});

/* ═══════════════════════════════════════════════════════
   THE PERIOD PLUG — when, not what
   ═══════════════════════════════════════════════════════ */

const plugEl    = document.getElementById("plug");
const stripEl   = document.getElementById("plugStrip");
const toggleEl  = document.getElementById("plugToggle");
const Y_LO = YEAR_MIN, Y_HI = YEAR_MAX + 1;      // half-open: [2021, 2027)
const SPAN = Y_HI - Y_LO;

document.getElementById("plugLo").textContent = Y_LO;
document.getElementById("plugHi").textContent = YEAR_MAX;

function frac(e){
  if(e.date){
    const [y, m, d] = e.date.split("-").map(Number);
    return y + ((m - 1) + (d - 1) / 31) / 12;
  }
  return parseInt(e.year, 10) + 0.5;            // year-only entries sit mid-year
}
function leftPct(f){ return (f - Y_LO) / SPAN * 100; }

/* a wash, not ticks — smoothed density so clusters read as weight */
function buildWash(){
  const fs = ENTRIES.map(frac);
  const N = 64, sigma = 0.34;
  const stops = [];
  let vals = [];
  for(let i = 0; i < N; i++){
    const f = Y_LO + (i / (N - 1)) * SPAN;
    let acc = 0;
    for(const x of fs){ const d = (x - f) / sigma; acc += Math.exp(-0.5 * d * d); }
    vals.push(acc);
  }
  const peak = Math.max(...vals) || 1;
  vals.forEach((v, i) => stops.push(
    "rgba(19,21,25," + (0.05 + 0.42 * Math.pow(v / peak, 0.9)).toFixed(3) + ") " +
    (i / (N - 1) * 100).toFixed(2) + "%"));
  const wash = document.createElement("div");
  wash.className = "plug__wash";
  wash.style.background = "linear-gradient(to right," + stops.join(",") + ")";
  stripEl.appendChild(wash);
}
buildWash();

const bandEl = document.createElement("div");
bandEl.className = "plug__band";
stripEl.appendChild(bandEl);

function paintPeriod(){
  const l = leftPct(fromYear), r = leftPct(toYear + 1);
  bandEl.style.left    = l + "%";
  bandEl.style.width   = (r - l) + "%";
  bandEl.style.opacity = isAllTime() ? "0" : "1";
  toggleEl.textContent = isAllTime() ? "All time"
    : fromYear === toYear ? String(fromYear)
    : fromYear + " — " + toYear;
}

/* The arrangement as it stood before a filter gathered things up. */
let baseLayout = null;

/* A filter should collect the work, not just dim it — otherwise fitting a
   scattered box zooms out until nothing is readable. */
function gatherMatches(idx){
  if(!baseLayout) baseLayout = layout.map(o => ({ ...o }));
  const a = freeArea();
  const CELL = 300, ROW = 350;
  const cols = Math.max(1, Math.min(idx.length,
    Math.round(Math.sqrt(idx.length * Math.max(a.w / Math.max(a.h, 1), 0.4)))));
  const rows = Math.ceil(idx.length / cols);
  const w = (cols - 1) * CELL, h = (rows - 1) * ROW;
  idx.forEach((n, k) => {
    const L = layout[n];
    L.x = -w / 2 + (k % cols) * CELL;
    L.y = -h / 2 + Math.floor(k / cols) * ROW;
    L.rot = 0;
  });
}

function releaseMatches(){
  if(baseLayout){ layout = baseLayout; baseLayout = null; }
}

function applyFilters(){
  const narrowed = activeCat !== "all" || !isAllTime();
  const idx = ENTRIES.map((e, i) => i).filter(visible);
  const gathering = narrowed && idx.length > 0;

  if(gathering) gatherMatches(idx); else releaseMatches();
  nodes.forEach((el, i) => el.classList.toggle("is-hidden", narrowed && !visible(i)));
  // the masthead would sit on top of the gathered grid, so it steps aside too
  [titleNode].concat(headNodes).forEach(el => el.classList.toggle("is-hidden", gathering));

  paintPeriod();
  planeEl.classList.add("is-eased");
  paintNodes();
  if(gathering) fitAll(); else recenter();
  clearTimeout(applyFilters._t);
  applyFilters._t = setTimeout(() => planeEl.classList.remove("is-eased"), 640);
}

/* drag either end; lands on whole years, but eases rather than snaps */
let dragging = null;

function boundaryAt(clientX){
  const r = stripEl.getBoundingClientRect();
  const f = Y_LO + ((clientX - r.left) / r.width) * SPAN;
  return Math.max(Y_LO, Math.min(Y_HI, Math.round(f)));
}
function moveEnd(which, b){
  if(which === "hi") toYear   = Math.min(YEAR_MAX, Math.max(b - 1, fromYear));
  else               fromYear = Math.max(YEAR_MIN, Math.min(b, toYear));
  applyFilters();
}

stripEl.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  const b = boundaryAt(ev.clientX);
  dragging = Math.abs(b - (toYear + 1)) <= Math.abs(b - fromYear) ? "hi" : "lo";
  moveEnd(dragging, b);
});
document.addEventListener("pointermove", ev => {
  if(dragging) moveEnd(dragging, boundaryAt(ev.clientX));
});
document.addEventListener("pointerup", () => { dragging = null; });

function resetPeriod(){
  fromYear = YEAR_MIN; toYear = YEAR_MAX;
  applyFilters();
}
stripEl.addEventListener("dblclick", resetPeriod);

/* closed by default; the readout is the handle */
toggleEl.addEventListener("click", () => {
  const open = plugEl.classList.toggle("is-open");
  toggleEl.setAttribute("aria-expanded", String(open));
});
document.addEventListener("pointerdown", ev => {
  if(!plugEl.contains(ev.target)){
    plugEl.classList.remove("is-open");
    toggleEl.setAttribute("aria-expanded", "false");
  }
}, true);

function syncRailHeight(){
  document.documentElement.style.setProperty("--railh", railEl.offsetHeight + "px");
}
syncRailHeight();
window.addEventListener("resize", () => {
  syncRailHeight();
  // the plug is hidden on narrow screens; never leave an invisible filter on
  if(window.innerWidth <= 720 && !isAllTime()) resetPeriod();
});
paintPeriod();

function doScatter(){
  tidyMode = false;
  untidyLayout = null;          /* this IS the new arrangement */
  document.getElementById("btnTidy").setAttribute("aria-pressed", "false");
  layout = scatterLayout(Date.now() % 100000);
  topZ = ENTRIES.length + 10;
  nodes.forEach(el => el.style.transition = "transform .55s cubic-bezier(.2,.75,.2,1)");
  paintNodes();
  setTimeout(() => nodes.forEach(el => el.style.transition = ""), 600);
  saveLayout();
}

function doTidy(){
  tidyMode = !tidyMode;
  document.getElementById("btnTidy").setAttribute("aria-pressed", String(tidyMode));
  if(tidyMode){
    untidyLayout = layout.map(o => ({ ...o }));
    layout = tidyLayout();
  }else{
    /* back to exactly what you had, not to a fresh scatter that throws away
       every sleeve you placed by hand */
    layout = untidyLayout || scatterLayout(20260828);
    untidyLayout = null;
  }
  nodes.forEach(el => el.style.transition = "transform .55s cubic-bezier(.2,.75,.2,1)");
  paintNodes();
  setTimeout(() => nodes.forEach(el => el.style.transition = ""), 600);
  saveLayout();
  recenter();          /* snap the grid, but stay at reading size — "Fit all" is the overview */
}

document.getElementById("btnRecenter").addEventListener("click", recenter);
document.getElementById("btnFit").addEventListener("click", fitAll);
document.getElementById("btnScatter").addEventListener("click", doScatter);
document.getElementById("btnTidy").addEventListener("click", doTidy);

/* the little label bottom-left, shared by the font and layout switches */
let tagTimer;
function flashTag(text){
  const tag = document.getElementById("accentTag");
  tag.textContent = text;
  tag.classList.add("is-show");
  clearTimeout(tagTimer);
  tagTimer = setTimeout(() => tag.classList.remove("is-show"), 2400);
}

function applyFont(f){
  const r = document.documentElement.style;
  r.setProperty("--hero-family", f.fam);
  r.setProperty("--hero-vf", f.vf);
  r.setProperty("--hero-weight", f.w);
  r.setProperty("--hero-style", f.st || "normal");
  r.setProperty("--hero-size", f.size);
  r.setProperty("--hero-lh", f.lh);
  r.setProperty("--hero-ls", f.ls);
  r.setProperty("--hero-tt", f.tt);

  flashTag(f.key + " · " + f.name);

  setTimeout(() => layoutHead(HEAD_MODES[headMode]), 60);
}

/* the title block is a plane citizen — keep its real box in sync with whatever
   face is loaded, or scatter-avoidance and Fit all work off stale numbers */
function measureTitle(){
  const r = titleNode.getBoundingClientRect();
  if(r.width && r.height){
    TITLE_W = r.width  / view.scale;
    TITLE_H = r.height / view.scale;
  }
}

/* ═══════════════════════════════════════════════════════
   THE READER
   ═══════════════════════════════════════════════════════ */

/* Opening an article never navigates. It frames the article's own page and
   pushes the article's own URL, so the address bar, the back button, sharing
   and a direct visit all behave exactly as they would have — while this
   document, and the <audio> inside it, stay alive. */

const readerEl      = document.getElementById("reader");
const readerFrame   = document.getElementById("readerFrame");
const CATALOG_TITLE = document.title;
let readerOpen = false;

const ARTICLE_URL = /\/articles\/[^\/]+\.html$/;
const CATALOG_URL = /(^|\/)index\.html$|\/$/;

/* a same-origin link to an article, on a plain unmodified left click. anything
   else — a new-tab click, an outside link — is left to the browser. */
function readable(a, ev){
  if(!a || a.target === "_blank") return null;
  if(ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return null;
  const u = new URL(a.getAttribute("href"), a.ownerDocument.baseURI);
  if(u.origin !== location.origin) return null;
  return u;
}

/* Point the frame at an article WITHOUT spending a history entry on it. A
   frame's first load is a replacement already, but assigning .src to a frame
   that has loaded once pushes an entry onto the joint session history — which
   would make Back need two presses to leave an article. replace() does not. */
let framedUrl = null;
function frameTo(url){
  const w = readerFrame.contentWindow;
  if(framedUrl && w) w.location.replace(url);
  else readerFrame.setAttribute("src", url);
  framedUrl = url;
}

/* the tab is named by whatever is on screen */
function syncTitle(){
  const d = readerOpen ? readerFrame.contentDocument : null;
  document.title = (d && d.title) || CATALOG_TITLE;
}

function openReader(url, push){
  if(push) history.pushState({ reader: url }, "", url);
  if(framedUrl !== url) frameTo(url);
  readerEl.classList.add("is-open");
  readerOpen = true;
  /* when the frame already holds this page — Forward, or reopening the same
     article — no load event is coming, so name the tab here instead of waiting */
  syncTitle();
  ejectDeck();          /* a video floating over an article is not wanted; music is */
}

function closeReader(){
  if(!readerOpen) return;
  readerEl.classList.remove("is-open");
  readerOpen = false;
  document.title = CATALOG_TITLE;
  /* the frame keeps the page it holds: reopening the same article is instant,
     and blanking it would cost exactly the history entry we just avoided */
}

/* The framed page is same-origin, so its own links can be kept honest: its
   "← Catalog" returns to the canvas we are still holding rather than loading a
   second copy of it inside the frame. */
readerFrame.addEventListener("load", () => {
  /* a frame that finishes loading after we already closed must not retitle the
     tab — closing and reopening quickly otherwise leaves the article's name
     sitting above the catalog. */
  if(!readerOpen) return;
  let d = null;
  try{ d = readerFrame.contentDocument; }catch(_){ return; }
  if(!d) return;

  syncTitle();

  d.querySelectorAll("a[href]").forEach(a => {
    const u = new URL(a.getAttribute("href"), d.baseURI);
    if(u.origin !== location.origin){ a.target = "_blank"; a.rel = "noopener"; }
  });

  d.addEventListener("click", ev => {
    const u = readable(ev.target.closest && ev.target.closest("a[href]"), ev);
    if(!u) return;
    if(CATALOG_URL.test(u.pathname)){ ev.preventDefault(); history.back(); }
    else if(ARTICLE_URL.test(u.pathname)){            /* article → article */
      ev.preventDefault();
      openReader(u.pathname + u.search + u.hash, true);
    }
  });

  /* Esc still closes, even though the keystroke lands inside the frame. */
  d.addEventListener("keydown", ev => { if(ev.key === "Escape") history.back(); });
});

/* every article link, wherever it is drawn — the detail CTA today, a blog index
   tomorrow — opens here instead of navigating. */
document.addEventListener("click", ev => {
  const u = readable(ev.target.closest && ev.target.closest("a[href]"), ev);
  if(!u || !ARTICLE_URL.test(u.pathname)) return;
  ev.preventDefault();
  openReader(u.pathname + u.search + u.hash, true);
});

window.addEventListener("popstate", ev => {
  const url = ev.state && ev.state.reader;
  if(url) openReader(url, false); else closeReader();
});

/* ═══════════════════════════════════════════════════════
   KEYBOARD
   ═══════════════════════════════════════════════════════ */

document.addEventListener("keydown", ev => {
  /* while reading, the canvas shortcuts are not the reader's to steal */
  if(readerOpen){
    if(ev.key === "Escape") history.back();
    return;
  }
  if(ev.key === "Escape"){
    if(detailEl.classList.contains("is-open")) closeDetail();
    else if(menuEl.classList.contains("is-open")) closeMenu();
    else clearFlips();
    return;
  }
  if(ev.target && ev.target.closest && ev.target.closest("input, textarea")) return;

  const STEP = ev.shiftKey ? 320 : 110;
  if(ev.key === "ArrowLeft"){  view.x += STEP; paintView(); ev.preventDefault(); }
  if(ev.key === "ArrowRight"){ view.x -= STEP; paintView(); ev.preventDefault(); }
  if(ev.key === "ArrowUp"){    view.y += STEP; paintView(); ev.preventDefault(); }
  if(ev.key === "ArrowDown"){  view.y -= STEP; paintView(); ev.preventDefault(); }
  if(ev.key === "0") recenter();
  if(ev.key === "f" || ev.key === "F") fitAll();
  if(ev.key === "t" || ev.key === "T") doTidy();
  const pick = FONTS.find(f => f.key === ev.key);                    /* TEMP */
  if(pick) applyFont(pick);
  if(ev.key === "q" || ev.key === "Q"){
    headMode = (headMode + 1) % HEAD_MODES.length;
    const m = HEAD_MODES[headMode];
    headNodes.forEach(el => el.style.transition = "transform .5s cubic-bezier(.2,.75,.2,1)");
    titleNode.style.transition = "transform .5s cubic-bezier(.2,.75,.2,1)";
    layoutHead(m);
    setTimeout(() => {
      headNodes.forEach(el => el.style.transition = "");
      titleNode.style.transition = "";
    }, 560);
    flashTag("Q · headline: " + m);
  }
  if(ev.key === "=" || ev.key === "+") zoomAt(innerWidth / 2, innerHeight / 2, 1.34);
  if(ev.key === "-" || ev.key === "_") zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.34);
});

document.addEventListener("pointerdown", ev => {
  if(!menuEl.contains(ev.target)) closeMenu();
}, true);

  hintEl.classList.add("is-gone");
}
setTimeout(dismissHint, 9000);

/* ═══════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════ */

const saved = loadLayout();

if(saved){
  layout = saved.layout;
  if(saved.head){
    saved.head.forEach((h, i) => {
      headNodes[i].style.fontSize = (h.size || 132) + "px";
      Object.assign(headNodes[i]._pos, h);
    });
    if(saved.title){ TITLE_POS.x = saved.title.x; TITLE_POS.y = saved.title.y; }
    paintFree();
    rebuildExclude();
  }else{
    applyHome();
  }
}else{
  layout = homeLayout();
  topZ = 50;
  applyHome();
}

paintNodes();

function applyHomeView(){
  const v = homeView();
  view.x = v.x; view.y = v.y; view.scale = v.scale;
  paintView();
}
applyHomeView();

/* The display faces land after first paint and change how wide the headline
   measures, so the opening view above was centred on fallback metrics.
   Remeasure, then re-derive home — but leave it alone if the visitor has
   already panned, zoomed or dragged in the meantime. */
if(document.fonts && document.fonts.ready){
  const v0 = { x: view.x, y: view.y, scale: view.scale };
  document.fonts.ready.then(() => {
    rebuildExclude();
    if(view.x === v0.x && view.y === v0.y && view.scale === v0.scale) applyHomeView();
  });
}

let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(paintView, 120);
});
</script>
</body>
</html>
