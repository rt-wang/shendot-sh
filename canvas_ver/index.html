<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>shen. catalog</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sedgwick+Ave+Display&family=Rubik+Wet+Paint&family=Kablammo&display=swap" rel="stylesheet">   <!-- TEMP: 4-9 are headline trials -->
<style>
/* Self-hosted from the user's own licence — see fonts/ */
@font-face{
  font-family:"ZT Formom";
  src:url("fonts/ZTFormom-Regular.woff2") format("woff2");
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"ZT Formom";
  src:url("fonts/ZTFormom-Italic.woff2") format("woff2");
  font-weight:400; font-style:italic; font-display:swap;
}

:root{
  --page:#DAD9D4;
  --paper:#EFEEEA;
  --ash:#C6C5BF;
  --ink:#131519;
  --ink-soft:#6E6F6A;
  --rule:#B9B8B2;
  --accent:#2320E8;        /* electric blue */
  --accent-deep:#1512A0;
  --accent-lift:#7C7AFF;   /* lifted, for use on the dark detail panel */
  --tint-template:#7A4A22; /* plywood, sampled from the logo — see .face--template */

  --panel:#191919;
  --panel-line:#2C2C2C;
  --panel-text:#E8E7E3;
  --panel-soft:#8F8F8F;

  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* the big headline, swappable — see the FONTS trial block */
  --hero-family:"ZT Formom","Archivo",sans-serif;
  --hero-vf:normal;
  --hero-weight:400;
  --hero-style:italic;   /* option 2 — the drawn Italic cut */
  --hero-size:118px;
  --hero-lh:.84;
  --hero-ls:-.01em;
  --hero-tt:uppercase;

  --gutter:clamp(18px,4vw,56px);
  --bar:52px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--page);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}
a{color:inherit}
button{font:inherit;color:inherit}

.mono{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

/* ══════════════ the plane ══════════════ */

#canvas{
  position:fixed;
  inset:0;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  background-image:radial-gradient(circle, rgba(19,21,25,.16) 1px, transparent 1px);
  background-size:26px 26px;
  background-position:0 0;
}
#canvas.is-panning{cursor:grabbing}

#plane{
  position:absolute;
  top:0;left:0;
  width:0;height:0;
  transform-origin:0 0;
  will-change:transform;
}
#plane.is-eased{transition:transform .58s cubic-bezier(.22,.72,.16,1)}

/* every free-floating thing on the plane */
.node{
  position:absolute;
  margin:0;
  transform-origin:50% 50%;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  transition:opacity .3s ease, filter .3s ease;
}
.node.is-dragging{cursor:grabbing}
.node.is-dimmed{opacity:.14;filter:saturate(.2);pointer-events:none}
/* while a filter has gathered the matches, the rest step off the plane */
.node.is-hidden{opacity:0;pointer-events:none}

/* ══════════════ the sleeve ══════════════ */

.sleeve{
  width:100%;
  aspect-ratio:1/1;
  perspective:1400px;
}
.sleeve__inner{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.2,.75,.2,1), box-shadow .3s ease;
  box-shadow:0 2px 5px rgba(19,21,25,.14);
}
.node:hover .sleeve__inner{box-shadow:0 22px 46px rgba(19,21,25,.26)}
.node.is-dragging .sleeve__inner{
  box-shadow:0 34px 70px rgba(19,21,25,.34);
  transition:box-shadow .18s ease;
}
.node.is-flipped .sleeve__inner{transform:rotateY(180deg)}
.node:focus-visible{outline:none}
.node:focus-visible .sleeve__inner{outline:2px solid var(--accent);outline-offset:5px}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.face--back{
  transform:rotateY(180deg);
  background:var(--paper);
  border:1px solid var(--ink);
  padding:16px;
  justify-content:space-between;
}

.spine{
  position:absolute;
  left:0;top:0;bottom:0;
  width:22px;
  border-right:1px solid currentColor;
  opacity:.5;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:10px;
}
.spine span{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.18em;
}

.face--front{padding:16px 16px 16px 34px;justify-content:space-between}
.face--code{background:var(--ink);color:var(--paper)}
.face--music{background:var(--accent);color:var(--paper)}

/* real sleeve art, full-bleed under the type */
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.face--music:has(.art)::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(12,10,8,.58) 0%, rgba(12,10,8,0) 30%,
    rgba(12,10,8,0) 46%, rgba(12,10,8,.88) 100%);
}
.face--music > *:not(.art):not(.spine){position:relative;z-index:2}
.face--music .spine{z-index:2}
.face--video{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.face--writing{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.face--post{background:var(--ash);color:var(--ink);border:1px solid var(--ink)}
/* An optional per-entry tint, set with `tint:"…"` on the entry. Overrides the
   category colour, so it has to come after the faces above. canvas-catalog is
   the template this page itself runs on — the one sleeve about the catalog
   rather than in it — so it wears the plywood of the logo instead of ink. */
.face--template{background:var(--tint-template);color:var(--paper)}
/* the warm ground is lighter than ink, so the fragment needs a little more */
.face--template .frag{opacity:.74}

.cover__no{font-family:var(--mono);font-size:11px;letter-spacing:.12em;opacity:.75}
.cover__title{
  font-family:var(--display);
  font-variation-settings:"wdth" 112,"wght" 800;
  /* sleeves are not all one size (a post is 198px, a film 268px), so the
     title scales with its own sleeve instead of overrunning the small ones */
  font-size:calc(var(--sleeve, 250) * 0.092px);
  overflow-wrap:break-word;
  hyphens:auto;
  line-height:.95;
  letter-spacing:-.01em;
  text-transform:uppercase;
  margin:0;
}
.cover__foot{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}

.frag{font-family:var(--mono);font-size:10px;line-height:1.7;opacity:.62;white-space:pre;overflow:hidden;margin:0}
.disc{
  align-self:center;width:46%;aspect-ratio:1;border-radius:50%;
  border:1px solid currentColor;display:grid;place-items:center;position:relative;
}
.disc::before,.disc::after{content:"";position:absolute;border-radius:50%;border:1px solid currentColor;opacity:.45}
.disc::before{inset:9%}
.disc::after{inset:20%}
.disc b{width:12%;aspect-ratio:1;border-radius:50%;background:currentColor;position:relative;z-index:1}
.frame{flex:1;margin:10px 0;border-top:9px solid var(--ink);border-bottom:9px solid var(--ink);display:grid;place-items:center}
.frame svg{width:34px;height:34px}
.frame--still{display:block;overflow:hidden;min-height:0}
.frame--still img{width:100%;height:100%;object-fit:cover;display:block}
.pull{font-family:var(--body);font-size:17px;line-height:1.28;margin:0;max-width:22ch}
.pull span{color:var(--accent)}
.postmark{font-family:var(--display);font-variation-settings:"wdth" 62,"wght" 900;font-size:72px;line-height:.7;color:var(--accent)}

/* liner back */
.liner__top{display:flex;justify-content:space-between;color:var(--ink-soft)}
.liner__title{
  font-family:var(--display);
  font-variation-settings:"wdth" 100,"wght" 750;
  font-size:18px;line-height:1.05;text-transform:uppercase;margin:14px 0 8px;
}
.liner__body{font-size:14px;line-height:1.35;margin:0;color:#2A2C30}
.liner__rows{
  margin:12px 0 0;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);
}
.liner__row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule)}
.liner__row b{color:var(--ink);font-weight:400}
.liner__scroll{overflow:hidden;flex:1;min-height:0}
.liner__cta{
  margin-top:12px;display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:2px;
}

/* caption under sleeve */
.caption{padding-top:10px;pointer-events:none}
.caption__title{font-family:var(--body);font-size:15px;line-height:1.2;margin:0 0 3px}
.caption__meta{margin:0;color:var(--ink-soft);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

/* ══════════════ title block on the plane ══════════════ */

.titleblock{width:620px}

/* each headline word is its own object on the plane */
.word{
  font-family:var(--hero-family);
  font-variation-settings:var(--hero-vf);
  font-weight:var(--hero-weight);
  font-style:var(--hero-style);
  line-height:.8;
  letter-spacing:var(--hero-ls);
  text-transform:var(--hero-tt);
  white-space:nowrap;
  color:var(--ink);
  padding:.06em .04em;
}
.word--accent{color:var(--accent)}
.word:hover{filter:drop-shadow(0 10px 18px rgba(19,21,25,.22))}
.node.is-dragging.word{filter:drop-shadow(0 26px 40px rgba(19,21,25,.32))}
.titleblock .eyebrow{color:var(--ink-soft);margin:0 0 18px}
.titleblock .note{margin:26px 0 0;max-width:44ch;font-size:17px;line-height:1.45}
.titleblock .note b{font-weight:600}
.titleblock .note a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}
.titleblock .note a:hover{color:var(--accent-deep);border-color:var(--accent-deep)}


/* ══════════════ the period plug ══════════════ */

/* Tucked against the right edge. Closed it is just its own readout; clicking
   unrolls a long, tight strip. No card around it. */
.plug{
  position:fixed;
  top:calc(var(--bar) + 13px);
  right:var(--gutter);
  z-index:30;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  user-select:none;
}
.plug__toggle{
  all:unset;cursor:pointer;
  font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);
  transition:color .18s ease;
}
.plug__toggle:hover{color:var(--ink)}
.plug__toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.plug.is-open .plug__toggle{color:var(--ink)}

.plug__body{
  width:320px;
  opacity:0;
  visibility:hidden;          /* authoritative: never a ghost mid-transition */
  transform:translateY(-5px);
  pointer-events:none;
  transition:opacity .2s ease,
             transform .22s cubic-bezier(.2,.75,.2,1),
             visibility 0s linear .2s;
}
.plug.is-open .plug__body{
  opacity:1;
  visibility:visible;
  transform:none;
  pointer-events:auto;
  transition-delay:0s;
}

.plug__strip{
  position:relative;width:100%;height:11px;
  background:rgba(239,238,234,.7);
  cursor:ew-resize;
  overflow:hidden;
}
.plug__wash{position:absolute;inset:0;pointer-events:none}
.plug__band{
  position:absolute;top:0;bottom:0;
  background:rgba(19,21,25,.10);
  border-left:1px solid var(--ink);
  border-right:1px solid var(--ink);
  pointer-events:none;
  transition:left .2s cubic-bezier(.2,.75,.2,1),
             width .2s cubic-bezier(.2,.75,.2,1),
             opacity .2s ease;
}
.plug__scale{
  display:flex;justify-content:space-between;
  margin-top:3px;
  font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--ink-soft);
}

@media(max-width:720px){
  /* mobile just needs the work to show up */
  .plug{display:none}
}

/* ══════════════ chrome ══════════════ */

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  height:var(--bar);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 var(--gutter);
  background:rgba(218,217,212,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule);
  pointer-events:none;
}
.topbar > *{pointer-events:auto}
.topbar__name{
  font-family:var(--display);
  font-variation-settings:"wdth" 118,"wght" 800;
  font-size:14px;letter-spacing:.02em;text-transform:uppercase;
}
.topbar__right{display:flex;align-items:center;gap:10px;color:var(--ink-soft)}

.tool{
  border:1px solid var(--rule);
  background:rgba(239,238,234,.7);
  padding:6px 11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
  transition:background .16s ease, border-color .16s ease, color .16s ease;
}
.tool:hover{background:var(--paper);border-color:var(--ink);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.zoomreadout{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--ink-soft);min-width:44px;text-align:right;
}

/* bottom rail: filters */
.rail{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;align-items:stretch;
  background:rgba(218,217,212,.9);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  overflow-x:auto;
}
.chip{
  flex:1 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 20px;
  border:0;border-right:1px solid var(--rule);
  background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);
  transition:background .16s ease,color .16s ease;
}
.chip:hover:not(:disabled){background:var(--paper);color:var(--ink)}
/* the pressed state has to out-rank :hover, or the active chip goes pale under the cursor */
.chip[aria-pressed="true"]:not(:disabled){background:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.4;cursor:default}
.chip .count{opacity:.6}

/* hint, fades out */
.hint{
  position:fixed;left:50%;bottom:64px;transform:translateX(-50%);
  z-index:29;
  display:flex;gap:18px;align-items:center;
  padding:9px 16px;
  background:rgba(19,21,25,.9);
  color:var(--panel-text);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  pointer-events:none;
  transition:opacity .6s ease;
}
.hint b{color:var(--accent-lift);font-weight:400}
.hint.is-gone{opacity:0}

/* TEMP — readout for the font (1-9) and headline-layout (Q) switches. */
.accenttag{
  position:fixed;left:var(--gutter);bottom:64px;z-index:29;
  padding:7px 13px;
  background:var(--accent);color:#FFF6F1;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.accenttag.is-show{opacity:1}

/* ══════════════ right-click menu ══════════════ */

.ctxmenu{
  position:fixed;z-index:60;
  min-width:184px;
  background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 18px 40px rgba(19,21,25,.28);
  display:none;
  padding:4px 0;
}
.ctxmenu.is-open{display:block}
.ctxmenu__head{
  padding:8px 13px 9px;
  border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ctxmenu button{
  display:flex;width:100%;justify-content:space-between;gap:18px;
  padding:8px 13px;border:0;background:transparent;text-align:left;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);
}
.ctxmenu button:hover{background:var(--ink);color:var(--paper)}
.ctxmenu button:hover kbd{color:var(--paper)}
.ctxmenu kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);background:none}

/* ══════════════ detail page — dark, so the player sits flush in it ══════════════ */

.detail{
  position:fixed;inset:0;z-index:70;
  display:none;
  background:rgba(12,13,15,.66);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.detail.is-open{display:block}
.detail__sheet{
  position:absolute;
  top:0;right:0;bottom:0;
  width:min(660px,100%);
  background:var(--panel);
  color:var(--panel-text);
  border-left:1px solid var(--panel-line);
  overflow-y:auto;
  padding:clamp(24px,4vw,46px);
  animation:slide .42s cubic-bezier(.2,.75,.2,1);
  scrollbar-color:var(--panel-line) transparent;
}
@keyframes slide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}

.detail__close{
  position:absolute;top:16px;right:clamp(24px,4vw,46px);
  border:1px solid var(--panel-line);background:transparent;
  padding:6px 11px;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--panel-soft);
}
.detail__close:hover{border-color:var(--panel-soft);color:var(--panel-text)}

.detail__no{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-lift);
}
.detail__title{
  font-family:var(--display);
  font-variation-settings:"wdth" 116,"wght" 830;
  font-size:clamp(32px,5vw,58px);
  line-height:.9;letter-spacing:-.02em;text-transform:uppercase;
  color:var(--panel-text);
  margin:14px 0 0;
}
.detail__format{
  margin:14px 0 0;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--panel-soft);
}
.detail__blurb{margin:24px 0 0;font-size:19px;line-height:1.42;max-width:52ch;color:var(--panel-text)}
.detail__alt{margin:10px 0 0;font-size:15px;line-height:1.4;color:var(--panel-soft);max-width:52ch}

/* no wrapper chrome — the embed brings its own card, let it meet the sheet directly.
   the player itself lives in #deck, which parks over this reserved box; the slot only
   holds the space so the sheet's rhythm is unchanged. */
.detail__slot{margin:28px 0 0}
.detail__slot--ratio{aspect-ratio:16/9}

/* a record we can play ourselves: sleeve on the left, the transport lives in the bar */
.record{display:flex;gap:20px;align-items:flex-end;height:auto!important}
.record__art{
  width:clamp(120px,26%,172px);aspect-ratio:1;object-fit:cover;
  border:1px solid var(--panel-line);background:#0F1013;flex:0 0 auto;
}
.record__side{flex:1 1 auto;min-width:0;padding-bottom:4px}
.record__play{
  display:inline-flex;align-items:center;gap:10px;
  border:1px solid var(--panel-text);background:transparent;color:var(--panel-text);
  padding:10px 16px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.record__play:hover{background:var(--panel-text);color:var(--panel)}
.record__play svg{width:11px;height:11px;fill:currentColor}
.record__note{
  margin:12px 0 0;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--panel-soft);
}

/* tracklist rows become the queue once we own the audio */
.detail__track--live{cursor:pointer}
.detail__track--live:hover span:first-child{color:var(--accent-lift)}
.detail__track--on span:first-child{color:var(--accent-lift)}
.detail__track--on span:first-child::before{content:"▸ ";}

/* shown instead of a player when the deck is busy with another record */
.detail__takeover{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;
  border:1px dashed var(--panel-line);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--panel-soft);
}
.detail__takeover:hover{border-color:var(--panel-soft);color:var(--panel-text)}

.detail__rows{
  margin:28px 0 0;border-top:1px solid var(--panel-line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--panel-soft);
}
.detail__rows .liner__row{padding:9px 0;border-bottom:1px solid var(--panel-line)}
.detail__rows .liner__row b{color:var(--panel-text)}

.detail__tracks{margin:28px 0 0}
.detail__tracks h4{
  margin:0 0 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--panel-soft);font-weight:400;
}
.detail__track{
  display:flex;justify-content:space-between;gap:16px;
  padding:7px 0;border-bottom:1px solid var(--panel-line);
  font-size:15px;color:var(--panel-text);
}
.detail__track span:last-child{font-family:var(--mono);font-size:11px;color:var(--panel-soft)}

.detail__cta{
  margin-top:30px;display:inline-flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#F7F2EE;background:var(--accent);padding:12px 18px;text-decoration:none;
}
.detail__cta:hover{background:var(--accent-deep)}
/* nothing to link to yet — a ghost, not a faded button */
.detail__cta--soon{background:transparent;border:1px solid var(--panel-line);color:var(--panel-soft);cursor:default}

/* ══════════════ the reader ══════════════
   An article is a real page: its own file, its own <head>, its own CSS, its own
   URL, and landing on it directly still serves exactly that. What we cannot do
   is *navigate* to it from here — a top-level navigation tears this document
   down and takes barAudio with it. So the catalog frames the article instead
   and pushes its real address. The bar outranks this at z 75, so the music
   plays straight through and stays under your thumb while you read. */
.reader{
  position:fixed;inset:0;z-index:74;
  background:var(--page);
  display:none;
}
.reader.is-open{display:block}
.reader__frame{display:block;width:100%;height:100%;border:0}

/* ══════════════ the now-playing bar ══════════════
   our own transport over our own <audio>, because a cross-origin embed can be neither
   styled nor controlled. the <audio> lives in the bar and the bar never unmounts, so
   sound carries across panning, filtering and every sheet you open. */
.bar{
  position:fixed;
  right:var(--bar-r,var(--gutter));
  bottom:var(--bar-b,calc(var(--rail-h,48px) + 16px));
  z-index:75;
  --bar-w:min(430px,calc(100vw - 2 * var(--gutter)));
  /* closed it is the sleeve and nothing else — no pane, no padding, no border.
     the glass lives on ::before and fades in only when the tile opens. */
  width:48px;
  display:none;align-items:center;gap:13px;
  padding:0;
  border-radius:12px;
  overflow:hidden;                  /* the transport is clipped away when closed */
  color:var(--ink);
  cursor:grab;
  touch-action:none;                /* we drag it ourselves */
  background:none;
  border:0;
  box-shadow:0 8px 20px rgba(19,21,25,.28);   /* the sleeve's own drop, not a pane's */
  animation:deck-rise .3s cubic-bezier(.2,.75,.2,1);
  transition:width .34s cubic-bezier(.2,.75,.2,1),
             padding .34s cubic-bezier(.2,.75,.2,1),
             border-radius .3s ease,
             box-shadow .28s ease;
}
/* white glass: a bright tint over a heavy blur, a near-white hairline, and a
   highlight along the top edge — the catch of light is what reads as a pane */
.bar::before{
  content:"";position:absolute;inset:0;z-index:0;
  border-radius:inherit;
  background:
    linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.34)),
    rgba(255,255,255,.22);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 16px 40px rgba(19,21,25,.20),
    0 2px 6px rgba(19,21,25,.10);
  opacity:0;transition:opacity .26s ease;
  pointer-events:none;
}
.bar:hover::before,.bar.is-open::before{opacity:1}
/* without backdrop-filter the tint alone would be a smear — go opaque instead */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .bar::before{background:rgba(244,243,240,.97);border-color:rgba(19,21,25,.14)}
}
.bar.is-live{display:flex}
.bar > *{position:relative;z-index:1}        /* above the pane */
.bar:hover,.bar.is-open{
  width:var(--bar-w);padding:10px 12px 15px;border-radius:16px;
  box-shadow:none;                            /* ::before carries it once open */
}
.bar.is-dragging{cursor:grabbing;transition:none}
.bar.is-dragging *{pointer-events:none}

/* the sleeve is the one thing that never hides */
.bar__cover{
  position:relative;flex:0 0 auto;
  width:48px;height:48px;border-radius:12px;overflow:hidden;
  transition:width .34s cubic-bezier(.2,.75,.2,1),
             height .34s cubic-bezier(.2,.75,.2,1),
             border-radius .3s ease,
             box-shadow .28s ease;
}
.bar:hover .bar__cover,.bar.is-open .bar__cover{box-shadow:0 1px 3px rgba(19,21,25,.3)}
.bar:hover .bar__cover,.bar.is-open .bar__cover{width:38px;height:38px;border-radius:7px}
.bar__art{display:block;width:100%;height:100%;object-fit:cover;background:rgba(19,21,25,.1)}

/* three bars over the sleeve, so a closed tile still says it is playing */
.bar__eq{
  position:absolute;left:0;right:0;bottom:0;height:64%;
  display:flex;align-items:flex-end;justify-content:center;gap:2px;
  padding-bottom:5px;
  background:linear-gradient(180deg,rgba(10,11,13,0),rgba(10,11,13,.6));
  transition:opacity .16s ease;
}
.bar__eq i{
  width:2px;height:4px;border-radius:1px;background:#FFF;transform-origin:bottom;
  animation:eq .78s ease-in-out infinite alternate;
}
.bar__eq i:nth-child(2){animation-duration:.54s}
.bar__eq i:nth-child(3){animation-duration:.96s}
@keyframes eq{from{transform:scaleY(1)}to{transform:scaleY(3.6)}}
.bar.is-paused .bar__eq i{animation-play-state:paused}
/* open, the transport says it better than the bars do */
.bar:hover .bar__eq,.bar.is-open .bar__eq{opacity:0}

/* everything but the sleeve fades in as the tile opens */
.bar__transport,.bar__id,.bar__more,.bar__seek{opacity:0;transition:opacity .16s ease}
.bar:hover .bar__transport,.bar.is-open .bar__transport,
.bar:hover .bar__id,.bar.is-open .bar__id,
.bar:hover .bar__more,.bar.is-open .bar__more,
.bar:hover .bar__seek,.bar.is-open .bar__seek{opacity:1;transition-delay:.09s}

.bar__transport{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.bar__btn{
  border:0;background:transparent;cursor:pointer;color:var(--ink);
  padding:2px;line-height:0;
}
.bar__btn svg{fill:currentColor;display:block}
.bar__btn--step svg{width:20px;height:20px}
.bar__btn--play svg{width:26px;height:26px}
.bar__btn--loop svg{width:17px;height:17px}
.bar__btn--loop{color:rgba(19,21,25,.42)}
.bar__btn--loop[aria-pressed="true"]{color:var(--accent)}
.bar__btn:hover{color:var(--accent)}
.bar__btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.bar__id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.bar__title{
  font-size:15px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bar__sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bar__more{
  flex:0 0 auto;border:0;background:transparent;cursor:pointer;
  color:rgba(19,21,25,.5);letter-spacing:.16em;font-size:15px;padding:4px 6px;
}
.bar__more:hover{color:var(--ink)}

.bar__seek{
  position:absolute;left:12px;right:12px;bottom:7px;height:3px;
  background:rgba(19,21,25,.16);border-radius:2px;overflow:hidden;cursor:pointer;
}
/* the line is 3px but the grab area is not */
.bar__seek::before{content:"";position:absolute;left:0;right:0;top:-7px;height:14px}
.bar__seek i{display:block;height:100%;width:0;background:var(--ink)}
.bar__seek:hover i{background:var(--accent)}

/* the menu lives outside .bar, which clips — JS parks it over whatever corner
   the tile has been dragged to */
.bar__menu{
  position:fixed;z-index:76;
  min-width:196px;
  border-radius:12px;overflow:hidden;
  background:
    linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42)),
    rgba(255,255,255,.24);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 38px rgba(19,21,25,.22);
  display:none;flex-direction:column;
}
.bar__menu.is-open{display:flex}
.bar__menu button,.bar__menu a{
  border:0;background:transparent;text-align:left;text-decoration:none;cursor:pointer;
  padding:11px 14px;color:var(--ink-soft);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
}
.bar__menu button:hover,.bar__menu a:hover{background:rgba(255,255,255,.5);color:var(--ink)}

@media(max-width:720px){
  /* no hover on a phone — the tile opens on tap and fills the width when it does */
  .bar{--bar-w:calc(100vw - 24px);gap:11px}
  .bar.is-open{padding:9px 10px 14px}
  .bar__transport{gap:9px}
  .bar__sub{display:none}
}

/* ══════════════ the deck — the player that outlives the sheet ══════════════
   it never changes parents: moving an iframe in the DOM reloads it and the sound cuts
   out. it only repositions — parked over the sheet's slot, or docked in the corner. */
.deck{position:fixed;z-index:80;display:none;box-sizing:border-box}
.deck.is-live{display:block}
.deck__media{overflow:hidden}
.deck__media iframe,
.deck__media video{display:block;width:100%;height:100%;border:0;background:transparent}
.deck__media video{background:#000}
.deck__bar{display:none}

/* docked: a now-playing row along the bottom. the embed is rendered wide and scaled
   down to bar height, so its own transport keeps working at a fraction of the size. */
/* docked, the video is the whole widget — no pane around it, the way the music
   tile is just its sleeve. the only chrome is a close button on hover. */
.deck.deck--docked{   /* beats .deck.is-live{display:block} on specificity */
  right:var(--gutter);bottom:calc(var(--rail-h,48px) + 16px);
  width:min(440px,calc(100vw - 2 * var(--gutter)));
  display:block;
  padding:0;border:0;background:none;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(19,21,25,.32);
  animation:deck-rise .32s cubic-bezier(.2,.75,.2,1);
}
.deck--docked .deck__media{border-radius:12px}
.deck--docked .deck__bar{
  position:absolute;top:8px;right:8px;z-index:2;
  display:flex;gap:6px;
  opacity:0;transition:opacity .16s ease;
}
.deck--docked:hover .deck__bar,
.deck--docked:focus-within .deck__bar{opacity:1}
.deck--docked .deck__btn{
  width:30px;height:30px;padding:0;
  display:grid;place-items:center;
  color:#FFF;border:0;background:transparent;cursor:pointer;
  opacity:.9;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));
  transition:transform .15s ease,opacity .15s ease;
}
.deck--docked .deck__btn svg{width:15px;height:15px;display:block}
/* leaving is a decision — the cross grows under the cursor, nothing else */
.deck--docked .deck__btn:hover,
.deck--docked .deck__btn:focus-visible{opacity:1;transform:scale(1.4)}
.deck--docked .deck__btn:focus-visible{outline:2px solid #FFF;outline-offset:2px}
/* and the band under it deepens, so the whole corner reads as the way out */
.deck--docked .deck__bar:hover ~ .deck__scrim--top{
  background:linear-gradient(180deg,
    rgba(20,21,24,.94) 0%,
    rgba(20,21,24,.56) 52%,
    rgba(20,21,24,0) 100%);
}

/* Instead of a button sitting on a plate: neutral-grey bands washing the top and
   bottom edges on hover, with the x living in the top one. They fade out into the
   picture rather than ending on a line.

   These are plain gradients on purpose. backdrop-filter: grayscale() over the
   frame is the obvious way to do this and it makes Chrome stop painting the
   cross-origin iframe entirely — the video vanishes and you see the page behind
   it. Same family as transform: scale() blanking these frames. */
.deck__scrim{display:none}
.deck--docked .deck__scrim{
  display:block;
  position:absolute;left:0;right:0;z-index:1;pointer-events:none;
  opacity:0;transition:opacity .2s ease;
}
.deck--docked .deck__scrim--top{
  top:0;height:58px;border-radius:12px 12px 0 0;
  background:linear-gradient(180deg,
    rgba(28,29,32,.82) 0%,
    rgba(28,29,32,.44) 52%,
    rgba(28,29,32,0) 100%);
}
.deck--docked .deck__scrim--bot{
  bottom:0;height:42px;border-radius:0 0 12px 12px;
  background:linear-gradient(0deg,
    rgba(28,29,32,.72) 0%,
    rgba(28,29,32,.32) 55%,
    rgba(28,29,32,0) 100%);
}
.deck--docked:hover .deck__scrim,
.deck--docked:focus-within .deck__scrim{opacity:1}
/* the player shows what is playing, so this is for screen readers only */
.deck__now{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* the docked deck is the only place a deck button appears — see .deck--docked
   .deck__btn above. the pane-era styles that used to live here repainted the
   cross ink-dark on hover, which is invisible against the band. */
/* the sheet owns the right side — when it is open, both step out of its way */
.detail.is-open ~ .deck.deck--docked,
.detail.is-open ~ .bar:not(.bar--placed){right:auto;left:var(--gutter)}
@keyframes deck-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media(max-width:720px){
  /* no room to shrink a wide row into on a phone: full width, buttons underneath */
  .deck.deck--docked{
    left:12px;right:12px;width:auto;bottom:60px;
    flex-direction:column;align-items:stretch;
  }
  .deck--docked .deck__bar{justify-content:flex-end;padding-top:8px}
}

@media(max-width:720px){
  .titleblock{width:min(88vw,560px)}
  .hint{display:none}
  .detail__sheet{width:100%;border-left:0}

  /* The top bar has to survive a phone: at full size the name wrapped to two
     lines and the last button was pushed off the right edge. Recenter and Fit
     all are the ones worth keeping on a small screen; Scatter and Tidy are
     desk-bound play. */
  .topbar{gap:8px;padding:0 12px}
  .topbar__name{font-size:11px;white-space:nowrap}
  .topbar__right{gap:6px}
  .zoomreadout{display:none}
  #btnScatter,#btnTidy{display:none}
  .tool{padding:5px 8px;font-size:9px;white-space:nowrap}
}
@media(prefers-reduced-motion:reduce){
  #plane.is-eased{transition:none}
  .sleeve__inner{transition:none}
  .detail__sheet{animation:none}
}
</style>
</head>
<body>

<div id="canvas">
  <div id="plane"></div>
</div>

<header class="topbar">
  <span class="topbar__name">shen. catalog</span>
  <div class="topbar__right">
    <span class="zoomreadout" id="zoomReadout">100%</span>
    <button class="tool" id="btnRecenter" title="Return to origin (0)">&#8982; Recenter</button>
    <button class="tool" id="btnFit" title="Fit everything in view (F)">&#8865; Fit all</button>
    <button class="tool" id="btnScatter" title="Re-scatter the plane">&#8623; Scatter</button>
    <button class="tool" id="btnTidy" aria-pressed="false" title="Snap to a grid (T)">&#8862; Tidy</button>
  </div>
</header>

<div class="plug" id="plug" aria-label="Filter by period">
  <button class="plug__toggle" id="plugToggle" aria-expanded="false">All time</button>
  <div class="plug__body">
    <div class="plug__strip" id="plugStrip"></div>
    <div class="plug__scale"><span id="plugLo"></span><span id="plugHi"></span></div>
  </div>
</div>
<nav class="rail" id="rail" aria-label="Filter the canvas"></nav>

<div class="hint" id="hint">
  <span><b>drag</b> the ground to pan</span>
  <span><b>drag</b> a sleeve to move it</span>
  <span><b>hover</b> to read the back</span>
  <span><b>click</b> to open</span>
  <span><b>right-click</b> for more</span>
</div>

<div class="accenttag" id="accentTag"></div>

<div class="ctxmenu" id="ctxmenu" role="menu"></div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Entry detail">
  <div class="detail__sheet" id="detailSheet"></div>
</div>

<div class="reader" id="reader">
  <iframe class="reader__frame" id="readerFrame" title="Article"></iframe>
</div>

<div class="bar" id="bar">
  <audio id="barAudio" preload="metadata"></audio>
  <div class="bar__cover">
    <img class="bar__art" id="barArt" alt="">
    <span class="bar__eq" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <div class="bar__transport">
    <button class="bar__btn bar__btn--step" data-bar="prev" title="Previous" aria-label="Previous track">
      <svg viewBox="0 0 24 24"><path d="M22 5v14l-9-7zM11 5v14l-9-7z"/></svg></button>
    <button class="bar__btn bar__btn--play" data-bar="toggle" title="Play" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M6 3.5 20.5 12 6 20.5z"/></svg></button>
    <button class="bar__btn bar__btn--step" data-bar="next" title="Next" aria-label="Next track">
      <svg viewBox="0 0 24 24"><path d="M2 5v14l9-7zM13 5v14l9-7z"/></svg></button>
    <button class="bar__btn bar__btn--loop" data-bar="loop" aria-pressed="false" title="Repeat" aria-label="Repeat">
      <svg viewBox="0 0 24 24"><path d="M7 7h11v3l5-4.5L18 1v3H4v7h3zm10 10H6v-3l-5 4.5L6 23v-3h14v-7h-3z"/></svg></button>
  </div>
  <div class="bar__id">
    <span class="bar__title" id="barTitle"></span>
    <span class="bar__sub" id="barSub"></span>
  </div>
  <button class="bar__more" data-bar="more" aria-label="More" aria-expanded="false">•••</button>
  <div class="bar__seek" id="barSeek"><i id="barFill"></i></div>
</div>
<div class="bar__menu" id="barMenu"></div>

<div class="deck" id="deck">
  <div class="deck__bar">
    <span class="deck__now"></span>
    <button class="deck__btn" data-deck="eject" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="deck__media"></div>
  <div class="deck__scrim deck__scrim--top"></div>
  <div class="deck__scrim deck__scrim--bot"></div>
</div>

<script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>

<script>
/* ═══════════════════════════════════════════════════════
   DATA
   ═══════════════════════════════════════════════════════ */

  return (activeCat === "all" || e.cat === activeCat) && inPeriod(e);
}
let tidyMode = false;
/* Tidy is a way of LOOKING at the arrangement, not a new arrangement. The real
   one waits here while the grid is on screen, so it is what gets saved and what
   comes back when Tidy goes off. */
let untidyLayout = null;

/* the title block is a plane citizen too — draggable, and scatter avoids it */
const TITLE_POS = { x: -520, y: -160 };
let EXCLUDE = [];                 /* rects the scatter must not land on */
let TITLE_W = 1000, TITLE_H = 430;

/* deterministic scatter so a reload looks the same unless you re-scatter */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Golden-angle spiral with jitter: an organic cluster that never stacks
   two sleeves dead-on, and grows outward as the catalog grows. Anything
   that lands on the title block gets pushed radially clear of it. */
function scatterLayout(seed){
  const rand = mulberry32(seed);
  const GOLDEN = 2.399963229728653;
  return ENTRIES.map((e, i) => {
    const size = CAT_SIZE[e.cat] || 240;
    const a = i * GOLDEN + rand() * 0.45;
    let r = 330 * Math.sqrt(i + 1.15) * (0.88 + rand() * 0.26);
    let x, y;
    for(let guard = 0; guard < 24; guard++){
      x = Math.cos(a) * r * 1.22 - size / 2;
      y = Math.sin(a) * r * 0.94 - size / 2;
      if(!overlapsTitle(x, y, size)) break;
      r += 90;                       // shove it further out along its ray
    }
    return { x, y, rot: (rand() - 0.5) * 10, z: i + 1, size };
  });
}

/* the headline words and the intro copy each carve out their own no-go rect */
function overlapsTitle(x, y, size){
  const M = 44, h = size + 54;       // sleeve + caption
  return EXCLUDE.some(r =>
    x < r.x + r.w + M && x + size > r.x - M &&
    y < r.y + r.h + M && y + h    > r.y - M);
}

/* Tidy: the crate grid, hung directly off the bottom-left of the title block. */
/* The box a node actually paints into. A rotated word sweeps a wider, shorter
   box than its set size, and this is the honest bound of it — unlike EXCLUDE,
   which pads rotated words by half their length to keep the random scatter well
   clear of them. Tidy wants the real edge, not that cushion. */
function paintedBox(el){
  const w = el.offsetWidth, h = el.offsetHeight;
  const r = (el._pos.rot || 0) * Math.PI / 180;
  const c = Math.abs(Math.cos(r)), sn = Math.abs(Math.sin(r));
  const W = w * c + h * sn, H = w * sn + h * c;
  return { x: el._pos.x + (w - W) / 2, y: el._pos.y + (h - H) / 2, w: W, h: H };
}

function tidyLayout(){
  const COL = 4, CELL = 300, SIZE = 250;
  /* The headline words live outside the title block's own box, so clearing
     TITLE_H alone let the first row slide under them. Measure the words
     themselves — reusing EXCLUDE here dropped the grid half a word's length
     down the page, which read as a hole under the headline.
     TITLE_H is a starting guess (430) that only measureTitle() corrects, and it
     was reserving ~265px of empty page under the intro. Measure the block. */
  let left = Infinity, bottom = -Infinity;
  [titleNode].concat(headNodes).map(paintedBox).forEach(r => {
    left   = Math.min(left, r.x);
    bottom = Math.max(bottom, r.y + r.h);
  });
  // TITLE_H is only refreshed when the headline face changes, so it can still be
  // its 430 default while the block is half that — measure the node, not the guess
  if(!isFinite(left)){ left = TITLE_POS.x; bottom = TITLE_POS.y + TITLE_H; }
  const x0 = left;
  const y0 = bottom + 64;
  return ENTRIES.map((e, i) => ({
    x: x0 + (i % COL) * CELL,
    y: y0 + Math.floor(i / COL) * (SIZE + 100),
    rot: 0,
    z: i + 1,
    size: SIZE
  }));
}

/* HOME_LAYOUT is a captured arrangement. Entries added since it was captured
   get tidy-grid positions appended, so every node has one. */
function homeLayout(){
  const base = HOME_LAYOUT.slice(0, ENTRIES.length).map(o => ({ ...o }));
  if(base.length < ENTRIES.length){
    // anything added since the capture joins the scatter, not a grid row
    const rest = scatterLayout(20260829);
    while(base.length < ENTRIES.length) base.push(rest[base.length]);
  }
  return base;
}

/* Returns a saved session, or null for a first visit (-> the HOME arrangement). */
function loadLayout(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if(raw && Array.isArray(raw.layout)){
      topZ = raw.topZ || topZ;
      // entries added since this session was saved get tidy positions appended,
      // rather than discarding the whole arrangement (and the title with it)
      if(raw.layout.length !== ENTRIES.length){
        const rest = scatterLayout(20260829);
        raw.layout = raw.layout.slice(0, ENTRIES.length);
        while(raw.layout.length < ENTRIES.length) raw.layout.push(rest[raw.layout.length]);
      }
      /* A session saved while Tidy was on reopens as a grid forever, because the
         grid went to storage as if it were the arrangement. Every other source
         of a layout rotates its sleeves and tidyLayout() alone zeroes them, so
         an all-zero rotation is that grid's signature: drop it back to the home
         arrangement, keeping the headline and intro block where they were. */
      if(raw.layout.length && raw.layout.every(o => o.rot === 0)) raw.layout = homeLayout();
      raw.head  = Array.isArray(raw.head) && raw.head.length === HOME_HEAD.length ? raw.head : null;
      raw.title = raw.title || null;
      return raw;
    }
  }catch(_){}
  return null;
}

/* the words and the intro block are draggable too, so they persist as well */
function saveLayout(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      layout: untidyLayout || baseLayout || layout, topZ,
      head: headNodes.map(el => ({ ...el._pos, size: parseFloat(el.style.fontSize) || 132 })),
      title: { x: TITLE_POS.x, y: TITLE_POS.y }
    }));
  }catch(_){}
}

/* ═══════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════ */

/* Cover titles set at a size relative to their own sleeve. A title carrying a
   very long word (ARCHITECTURE, SYNESTHETIC_LOOP) steps down until the word
   fits, rather than letting break-word snap it in half. */
function coverTitlePx(title){
  const longest = Math.max(...String(title).split(/\s+/).map(w => w.length), 1);
  const shrink = longest > 9 ? Math.max(0.6, 9 / longest) : 1;
  return "calc(var(--sleeve, 250) * " + (0.092 * shrink).toFixed(4) + "px)";
}

function coverArt(e){
  /* a fragment is text, not markup: a snippet containing <div> has to READ as
     a div, not silently become one */
  if(e.cat === "code")    return '<pre class="frag">' + escText(e.frag) + '</pre>';
  if(e.cat === "music")   return e.cover
    ? '<img class="art" src="' + e.cover + '" alt="" decoding="async">'
    : '<div class="disc"><b></b></div>';
  if(e.cat === "video")   return e.thumb
    ? '<div class="frame frame--still"><img src="' + e.thumb + '" alt="" decoding="async"></div>'
    : '<div class="frame"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>';
  if(e.cat === "writing") return '<p class="pull">' + e.pull + '</p>';
  return '<div class="postmark">&ldquo;</div>';
}

function sleeveHTML(e){
  const rows = e.rows.map(r => '<div class="liner__row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join("");
  return '' +
  '<div class="sleeve">' +
    '<div class="sleeve__inner">' +
      '<div class="face face--front face--' + e.cat +
          (e.tint ? " face--" + e.tint : "") + '">' +
        '<div class="spine"><span>' + e.no + ' · ' + e.year + '</span></div>' +
        '<div class="cover__no">' + e.no + '</div>' +
        coverArt(e) +
        '<div>' +
          '<h3 class="cover__title" style="font-size:' + coverTitlePx(e.title) + '">' +
            e.title + '</h3>' +
          '<div class="cover__foot">' + (e.cat === "video" ? e.tc : (e.kind || CAT_NAME[e.cat])) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="face face--back">' +
        '<div class="liner__scroll">' +
          '<div class="liner__top mono"><span>Liner notes</span><span>' + e.no + '</span></div>' +
          '<h3 class="liner__title">' + e.title + '</h3>' +
          (e.blurb ? '<p class="liner__body">' + e.blurb + '</p>' : "") +
          '<div class="liner__rows">' + rows + '</div>' +
        '</div>' +
        '<span class="liner__cta">' + e.cta + ' →</span>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<div class="caption">' +
    '<p class="caption__title">' + e.title + '</p>' +
    '<p class="caption__meta">' + e.format + ' · ' + e.year + '</p>' +
  '</div>';
}

const titleNode = document.createElement("div");
titleNode.className = "node titleblock";
titleNode.dataset.kind = "title";
titleNode.innerHTML =

/* ── the headline is not a text box. Every word is its own thing on the
   plane: own size, own angle, own position, draggable like a sleeve. ── */
const HEAD_WORDS = [

const headNodes = HEAD_WORDS.map((w, i) => {

  el.dataset.index = i;
  el.textContent = w.t;
  el._pos = { x: 0, y: 0, rot: 0, z: 40 + i };

const nodes = ENTRIES.map((e, i) => {
  const el = document.createElement("article");

  el.setAttribute("aria-label", e.title + " — hover to read the back, click to open");
  el.innerHTML = sleeveHTML(e);
  planeEl.appendChild(el);

});
